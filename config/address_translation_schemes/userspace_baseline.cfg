# Userspace MimicOS Baseline Configuration
# ==========================================
# Standard 4-level radix page table with 4KB pages and reserve_thp allocator.
# MimicOS runs as a userspace process pinned by Sniper, handling page faults
# and memory management natively rather than in sniper-space.
#
# Usage:
#   ./run-sniper -c config/address_translation_schemes/userspace_baseline.cfg \
#     -d <output_dir> --genstats -s stop-by-icount:<N> --roi --no-cache-warming \
#     -- <mimicos_binary> <mimicos_config> <trace.sift> <output_prefix>

# Base system (userspace MimicOS mode)
#include ./common_configs/base_system_userspace.cfg

# Core and cache configuration
#include ./core_configs/meteor_lake_pcore.cfg

# MMU configuration
#include ./mmu_configs/mmu_base.cfg

# Page table configuration
#include ./pagetable_configs/4_level_radix.cfg
#include ./pagetable_configs/range_table.cfg

# DRAM configuration
#include ./dram_configs/ddr4_2400.cfg

# Physical memory allocator
#include ./physical_memory_allocators/reserve_thp.cfg
